[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mofqi-reservoir"
version = "0.1.0"
description = "Multi-objective fitted Q-iteration for reservoir operation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Eleni Mickovska" }
]
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2.3,<4",
    "scikit-learn>=1.6,<2",
    "matplotlib>=3.9,<4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"